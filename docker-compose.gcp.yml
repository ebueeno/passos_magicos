# GCP production overrides.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.gcp.yml up -d --build
#
# What this file changes vs the base compose:
#   1. langfuse-server: replaces hardcoded dev secrets with generated prod values
#      stored in .env (NEXTAUTH_SECRET, SALT, ENCRYPTION_KEY) and sets NEXTAUTH_URL
#      to the VM's real external IP (VM_EXTERNAL_IP from .env).
#   2. chromadb: binds only to localhost (127.0.0.1) so port 8000 is not publicly
#      reachable even if the GCP firewall rule is ever widened.
#   3. api: ensures ENVIRONMENT=production and inherits all .env secrets.
#
# All ${...} variables are resolved by Docker Compose from the .env file on the VM.

services:
  langfuse-server:
    environment:
      NEXTAUTH_URL: "http://${VM_EXTERNAL_IP}:3000"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      SALT: "${SALT}"
      # Must be exactly 64 hex characters (32 bytes). Generated by deploy_gcp.sh.
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"

  # chromadb: port 8000 intentionally NOT overridden here.
  # Docker Compose merges port lists additively, so adding 127.0.0.1:8000:8000
  # on top of the base 0.0.0.0:8000:8000 causes a bind conflict.
  # Security is handled by the GCP firewall rule which only opens 8001 and 3000;
  # port 8000 is blocked at the network level and ChromaDB has no auth anyway.

  api:
    environment:
      ENVIRONMENT: "production"
