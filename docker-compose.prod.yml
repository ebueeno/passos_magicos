# Override para produção: workers e restart. Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  langfuse-db:
    restart: always

  langfuse-server:
    restart: always

  chromadb:
    restart: always

  api:
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    # volume ./data:/app/data mantido do docker-compose.yml
